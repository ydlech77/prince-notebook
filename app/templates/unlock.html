<!DOCTYPE html>
<html>
<head>
    <title>Unlock Note</title>

    <style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;

    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
    border-left: 1px solid #ddd;
    border-right: 1px solid #ddd;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* TITLE */
.title {
    margin-bottom: 20px;
    color: #111;
    font-size: 20px;
}

/* CARD */
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    width: 90%;
    text-align: center;
}

/* INPUT */
.input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 14px;
}

/* BUTTON */
.btn {
    width: 100%;
    padding: 12px;
    background: black;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

/* ERROR */
.error {
    color: red;
    margin-top: 10px;
    font-size: 13px;
}
</style>


</head>

<body>

    <h2 class="title">🔐 Enter Password</h2>

    <div class="card">
        <form method="POST">
            {% csrf_token %}

            <input type="password" name="unlock_password" placeholder="Enter password" class="input">

            <button type="submit" class="btn">Unlock</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

</body>
</html>
