<!DOCTYPE html>
<html>
<head>
    <title>Unlock Note</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
        }

        .title {
            margin-bottom: 20px;
            color: #333;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }

        .input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        .input:focus {
            border-color: #007bff;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
            background: #0056b3;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <h2 class="title">🔐 Enter Password</h2>

    <div class="card">
        <form method="POST">
            {% csrf_token %}

            <input type="password" name="unlock_password" placeholder="Enter password" class="input">

            <button type="submit" class="btn">Unlock</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

</body>
</html>
