<!DOCTYPE html>
<html>
<head>
    
    <title>Prince Dave Notebook</title>

    <style>
body {
    font-family: Arial;
    background: #f4f4f4;
    margin: 0;

    max-width: 450px;
    margin-left: auto;
    margin-right: auto;
    border-left: 1px solid #ddd;
    border-right: 1px solid #ddd;
}

/* HEADER */
header {
    background: #222;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;

    position: sticky;
    top: 0;
    z-index: 1000;
}

/* SEARCH BAR */
.search-box {
    text-align: center;
    margin: 10px;
}

.search-box input {
    width: 90%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* TOP BUTTON AREA */
.top-bar {
    display: flex;
    justify-content: flex-start;
    padding-left: 10px;
}

/* BUTTON */
.btn {
    display: inline-block;
    margin: 10px;
    padding: 10px 15px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

/* GRID (FIXED) */
.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    padding: 10px;
    gap: 10px;
}

/* NOTE CARD */
.note {
    background: #fff8a6;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    min-height: 160px;
    position: relative;
    cursor: grab;
    transition: 0.2s;
}

.note:hover {
    transform: scale(1.02);
}

.note h3 {
    margin: 0;
    font-size: 16px;
}

.note small {
    color: gray;
    font-size: 12px;
}

.note p {
    font-size: 13px;
    margin-top: 10px;
}

/* MEDIA */
img, video {
    width: 100%;
    margin-top: 10px;
    border-radius: 5px;
}

/* NOTE COLOR */
.yellow {
    background: #fff8a6;
}

/* OPEN BUTTON */
.open-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: #007bff;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-size: 13px;
    text-align: center;
    transition: 0.2s;
}

.open-btn:hover {
    background: #0056b3;
}

/* LOCK BADGE */
.lock-badge {
    font-size: 11px;
    background: #ff4d4d;
    color: white;
    padding: 3px 8px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
}

/* MOBILE FIX */
@media (max-width: 768px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
        padding: 10px;
        gap: 10px;
    }

    .note {
        min-height: 150px;
    }

    header {
        font-size: 18px;
    }

    .search-box input {
        width: 95%;
    }
}
</style>


</head>

<body>

<header>
    📒 Prince Dave Notebook
</header>

<!-- LEFT BUTTON -->
<div class="top-bar">
    <a class="btn" href="/create/">+ Create Note</a>
</div>

<!-- SEARCH -->
<div class="search-box">
    <input type="text" id="search" placeholder="Search notes...">
</div>

<div class="container" id="noteContainer">

    {% for note in notes %}

        <div class="note yellow draggable">

            <h3>
                {{ note.title }}

                {% if note.password %}
                    <span class="lock-badge">🔒 Locked</span>
                {% endif %}
            </h3>

            <small>{{ note.created_at }}</small>

            <p>{{ note.content|truncatechars:80 }}</p>

            {% if note.image %}
                <img src="{{ note.image.url }}">
            {% endif %}

            {% if note.video %}
                <video controls>
                    <source src="{{ note.video.url }}">
                </video>
            {% endif %}

            <br>

            <a class="open-btn" href="/note/{{ note.id }}/">Open</a>

        </div>

    {% endfor %}

</div>

<!-- SEARCH SCRIPT -->
<script>
document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    let notes = document.querySelectorAll(".note");

    notes.forEach(note => {
        let text = note.innerText.toLowerCase();
        note.style.display = text.includes(value) ? "block" : "none";
    });
});
</script>

</body>
</html>
